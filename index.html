<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK AI Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #09090b; color: #f4f4f5; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 850px; height: 95vh; background: #18181b; border: 1px solid #27272a; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 16px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; color: #38bdf8; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #09090b; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
        .user { background: #0284c7; align-self: flex-end; color: white; }
        .bot { background: #27272a; align-self: flex-start; border: 1px solid #3f3f46; color: #f4f4f5; }
        .input-container { padding: 16px; background: #18181b; display: flex; gap: 10px; }
        textarea { flex: 1; background: #27272a; border: 1px solid #3f3f46; color: white; padding: 10px; border-radius: 6px; resize: none; height: 45px; outline: none; font-size: 0.95rem; }
        button { background: #38bdf8; color: #09090b; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>DK AI Engine</h1>
        </header>

        <div id="chat-box"></div>

        <div class="input-container">
            <textarea id="user-input" placeholder="Ask DK AI anything..."></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            let input = document.getElementById("user-input");
            let chatBox = document.getElementById("chat-box");
            let text = input.value.trim();

            if (!text) return;

            // Render User Message
            let userMsg = document.createElement("div");
            userMsg.className = "message user";
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);

            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Render Loading Message
            let loadingMsg = document.createElement("div");
            loadingMsg.className = "message bot";
            loadingMsg.innerText = "DK AI is generating response...";
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                let res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                let data = await res.json();
                loadingMsg.innerText = data.reply || "No response generated.";
            } catch (err) {
                loadingMsg.innerText = "Error: Unable to connect to server.";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
